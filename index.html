<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Homey Energy Dashboard</title>

<style>

body{
  margin:0;
  background:#0b0f17;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.header{
  padding:28px;
  font-size:34px;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:22px;
  padding:22px;
}

.card{
  background:#171c26;
  border-radius:24px;
  padding:24px;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
}

.card h2{
  margin:0;
  font-size:22px;
}

.big{
  margin-top:18px;
  font-size:48px;
  font-weight:700;
}

.small{
  margin-top:10px;
  opacity:.7;
}

.batteries{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:22px;
  padding:22px;
}

.battery{
  background:#171c26;
  border-radius:24px;
  padding:24px;
  box-shadow:0 4px 18px rgba(0,0,0,.35);
}

.battery-title{
  font-size:22px;
  font-weight:700;
}

.soc{
  margin-top:16px;
  font-size:52px;
  font-weight:700;
}

.bar{
  width:100%;
  height:18px;
  background:#2d3442;
  border-radius:20px;
  overflow:hidden;
  margin-top:18px;
}

.fill{
  height:100%;
  background:#32d74b;
}

.row{
  display:flex;
  justify-content:space-between;
  margin-top:14px;
  opacity:.9;
}

.footer{
  padding:24px;
  opacity:.6;
}

.bleu{
  color:#4da3ff;
}

.blanc{
  color:#ffffff;
}

.rouge{
  color:#ff5c5c;
}

</style>
</head>

<body>

<div class="header">
  Homey Energy Dashboard
</div>

<div class="grid">

  <div class="card">
    <h2>☀️ Production Solaire</h2>
    <div class="big" id="solarPower">--</div>
    <div class="small">Production instantanée</div>
  </div>

  <div class="card">
    <h2>⚡ Réseau / Shelly</h2>
    <div class="big" id="gridPower">--</div>
    <div class="small">Puissance réseau</div>
  </div>

  <div class="card">
    <h2>🔋 Batteries Total</h2>
    <div class="big" id="batteryTotal">--</div>
    <div class="small">Charge / Décharge globale</div>
  </div>

  <div class="card">
    <h2>🎨 EDF Tempo</h2>
    <div class="big" id="tempoToday">--</div>
    <div class="small" id="tempoTomorrow">--</div>
  </div>

</div>

<div class="batteries" id="batteriesContainer"></div>

<div class="footer" id="updatedAt">
  Mise à jour...
</div>

<script>

function tempoClass(color){

  if(color === 'BLEU') return 'bleu';
  if(color === 'BLANC') return 'blanc';
  if(color === 'ROUGE') return 'rouge';

  return '';
}

function batteryState(direction){

  if(direction === 'CHARGING') return 'Charge';
  if(direction === 'DISCHARGING') return 'Décharge';
  if(direction === 'STALE') return 'Périmée';

  return 'Attente';
}

async function loadData(){

  try{

    const response = await fetch('/.netlify/functions/energy', { cache: 'no-store' });

const json = await response.json();
const data = json.data;

    document.getElementById('solarPower').innerText =
      `${data.solar.productionW} W`;

    document.getElementById('gridPower').innerText =
      `${data.grid.powerW} W`;

    document.getElementById('batteryTotal').innerText =
      `${data.totals.batteryPowerW} W`;

    document.getElementById('tempoToday').innerHTML =
      `<span class="${tempoClass(data.tempo.today)}">${data.tempo.today}</span>`;

    document.getElementById('tempoTomorrow').innerHTML =
      `Demain : <span class="${tempoClass(data.tempo.tomorrow)}">${data.tempo.tomorrow}</span>`;

    document.getElementById('updatedAt').innerText =
      `Dernière mise à jour : ${new Date(data.updatedAt).toLocaleString()}`;

    const container = document.getElementById('batteriesContainer');

    container.innerHTML = '';

    data.batteries.forEach(b => {

      const soc = Math.round(b.soc || 0);

      container.innerHTML += `

        <div class="battery">

          <div class="battery-title">
            ${b.homeyName}
          </div>

          <div class="soc">
            ${soc}%
          </div>

          <div class="bar">
            <div class="fill" style="width:${soc}%"></div>
          </div>

          <div class="row">
            <div>État</div>
            <div>${batteryState(b.direction)}</div>
          </div>

          <div class="row">
            <div>Puissance</div>
            <div>${b.powerW} W</div>
          </div>

          <div class="row">
            <div>Température</div>
            <div>${b.temperatureC}°C</div>
          </div>

          <div class="row">
            <div>Âge données</div>
            <div>${b.ageSec}s</div>
          </div>

        </div>

      `;
    });

  }catch(err){

    console.error(err);

  }

}

loadData();

setInterval(loadData,15000);

</script>

</body>
</html>

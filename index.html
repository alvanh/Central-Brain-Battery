<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Central Brain" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Central Brain Battery Live</title>
  <style>
    :root{--bg:#eef2f7;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--dark:#0f172a;--soft:#f8fafc}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    .wrap{max-width:1120px;margin:0 auto;padding:18px;padding-top:calc(14px + env(safe-area-inset-top))}
    header{position:sticky;top:0;z-index:2;margin:-18px -18px 14px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:rgba(238,242,247,.9);backdrop-filter:blur(18px);display:flex;justify-content:space-between;align-items:center;gap:12px}
    .kicker{font-size:12px;color:var(--muted);font-weight:800}.title{font-size:26px;font-weight:850;letter-spacing:-.7px}.source{font-size:12px;color:var(--muted);margin-top:3px}
    button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:9px 12px;font-weight:800}
    .grid{display:grid;gap:12px}.metrics{grid-template-columns:repeat(4,1fr)}.main{grid-template-columns:1fr 2fr;margin-top:12px}.batteries{grid-template-columns:repeat(2,1fr)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
    .label{font-size:12px;color:var(--muted)}.value{font-size:25px;font-weight:850;margin-top:6px}.small{font-size:12px;color:var(--muted);margin-top:7px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:#f1f5f9;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;color:#334155;white-space:nowrap}
    .bar{height:12px;border-radius:999px;background:#eef2f7;overflow:hidden;margin-top:12px}.bar>div{height:100%;background:var(--dark);border-radius:999px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.subcard{background:var(--soft);border-radius:17px;padding:12px}.flow .row{background:var(--soft);border-radius:15px;padding:12px;margin-top:9px}
    .warn{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
    @media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.main,.batteries{grid-template-columns:1fr}.flow{order:2}.batteries{order:1}.title{font-size:23px}.value{font-size:23px}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="kicker">Central Brain Battery</div><div class="title">Énergie maison</div><div class="source" id="source">Connexion Homey…</div></div>
    <button onclick="refresh()">Actualiser</button>
  </header>

  <section class="grid metrics">
    <div class="card"><div class="label">Solaire</div><div class="value" id="solar">—</div><div class="small">Homey</div></div>
    <div class="card"><div class="label">Maison</div><div class="value" id="house">—</div><div class="small">À ajouter ensuite</div></div>
    <div class="card"><div class="label">Réseau</div><div class="value" id="grid">—</div><div class="small">Shelly Pro 3EM</div></div>
    <div class="card"><div class="label">Batteries</div><div class="value" id="batPower">—</div><div class="small" id="batPowerSub">—</div></div>
  </section>

  <section class="grid main">
    <div class="card flow">
      <div class="row"><strong>Flux instantané</strong><span class="pill" id="time">—</span></div>
      <div class="row"><span>Solaire</span><strong id="flowSolar">—</strong></div>
      <div class="row"><span>Réseau</span><strong id="flowGrid">—</strong></div>
      <div class="row"><span>Total batteries</span><strong id="flowBats">—</strong></div>
      <div class="row"><span>Données reçues</span><strong id="received">—</strong></div>
    </div>
    <div class="grid batteries" id="batteries"></div>
  </section>
</div>

<script>
async function fetchLiveData(){
  const res = await fetch('/.netlify/functions/energy', { cache: 'no-store' });
  const json = await res.json();
  if (!json.ok) throw new Error(json.message || json.error || 'Aucune donnée');
  return json.data;
}
function fmtW(w){if(w===null||w===undefined||isNaN(w))return "—";const a=Math.abs(w);return a>=1000?(w/1000).toFixed(2)+" kW":Math.round(w)+" W"}
function labelDirection(d){
  return d==="CHARGING" ? "En charge" :
         d==="DISCHARGING" ? "En décharge" :
         d==="IDLE" ? "Attente" :
         d==="STALE" ? "Donnée périmée" :
         "Inconnu";
}

function modeLabel(m){
  return m==="charge" ? "Charge" :
         m==="decharge" ? "Décharge" :
         m==="attente" ? "Attente" :
         m==="donnee_perimee" ? "Périmée" :
         "Inconnu";
}
async function refresh(){
 try{
  const d=await fetchLiveData();
  const batteryTotal=d.totals?.batteryPowerW ?? d.batteries.reduce((s,b)=>s+(Number(b.powerW)||0),0);
  const gridW=d.grid?.powerW;
  const gridText=gridW<0?"Injection "+fmtW(Math.abs(gridW)):"Import "+fmtW(gridW);
  document.getElementById("source").textContent="Source : "+(d.source||"Homey")+" • live";
  document.getElementById("solar").textContent=fmtW(d.solar?.productionW);
  document.getElementById("house").textContent="—";
  document.getElementById("grid").textContent=gridText;
  document.getElementById("batPower").textContent=fmtW(Math.abs(batteryTotal));
  document.getElementById("batPowerSub").textContent=batteryTotal<0?"Charge globale":"Décharge globale";
  document.getElementById("flowSolar").textContent=fmtW(d.solar?.productionW);
  document.getElementById("flowGrid").textContent=gridText;
  document.getElementById("flowBats").textContent=fmtW(batteryTotal);
  document.getElementById("time").textContent=new Date(d.updatedAt).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("received").textContent=d.receivedAt ? new Date(d.receivedAt).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "—";
  document.getElementById("batteries").innerHTML=d.batteries.map(b=>`
   <div class="card">
    <div class="row"><strong>${b.name}</strong><span class="pill">${<span class="pill ${b.stale ? 'warn' : ''}">${labelDirection(b.direction)}</span>(b.direction)}</span></div>
    <div class="small">Mode : ${modeLabel(b.mode)} ${b.online===false ? "• hors ligne" : ""}</div>
    <div class="row" style="margin-top:14px"><div class="value">${b.soc ?? "—"}%</div><div class="small">SoC Homey</div></div>
    <div class="bar"><div style="width:${Math.max(0,Math.min(100,b.soc||0))}%"></div></div>
    <div class="two">
     <div class="subcard"><div class="label">Puissance</div><div class="value" style="font-size:21px">${fmtW(Math.abs(b.powerW))}</div><div class="small">${b.powerW<0?"Négatif":b.powerW>0?"Positif":"Repos"}</div></div>
     <div class="subcard"><div class="label">État</div><div class="value" style="font-size:21px">${modeLabel(b.mode)}</div><div class="small">${b.direction}</div></div>
    </div>
   </div>`).join("");
 }catch(err){
  document.getElementById("source").textContent="Erreur : "+err.message;
  document.getElementById("batteries").innerHTML='<div class="card warn">Aucune donnée Homey reçue. Lance le script V39-PUSH-NETLIFY depuis Homey.</div>';
 }
}
refresh(); setInterval(refresh,10000);
</script>
</body>
</html>

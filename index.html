<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Homey Energy Dashboard</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f6f7fb;
  color:#050816;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

.app{
  max-width:430px;
  margin:0 auto;
  padding:18px 14px 34px;
}

.title{
  font-size:24px;
  font-weight:900;
  margin:6px 0 16px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
  border:1px solid rgba(0,0,0,.06);
}

.tempo{
  height:116px;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.tempo .label{
  font-size:14px;
  font-weight:800;
  text-transform:uppercase;
}

.tempo .value{
  font-size:34px;
  font-weight:950;
  margin-top:6px;
}

.weather{
  font-size:34px;
  filter:grayscale(1) brightness(0) invert(1);
}

.blue{background:linear-gradient(135deg,#0066ff,#003eb7);}
.red{background:linear-gradient(135deg,#ff1a1a,#d80000);}
.white{
  background:#fff;
  color:#111;
  border:2px solid #ddd;
}
.white .weather{
  filter:grayscale(1) brightness(0);
}

.metric{
  height:120px;
}

.metric-title{
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
}

.metric-value{
  margin-top:24px;
  font-size:36px;
  font-weight:950;
  letter-spacing:-1px;
}

.battery{
  min-height:205px;
}

.battery-title{
  font-size:15px;
  font-weight:950;
  text-transform:uppercase;
}

.battery-main{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:18px;
}

.icon{
  width:48px;
  height:48px;
  border-radius:50%;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
  flex-shrink:0;
}

.icon.charge{background:#0a9f23;}
.icon.decharge{background:#e00000;}
.icon.attente{background:#ff7a00;}
.icon.stale{background:#8b8b8b;}

.soc{
  font-size:36px;
  font-weight:950;
  line-height:1;
}

.state{
  margin-top:5px;
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
}

.green{color:#0a9f23;}
.redText{color:#e00000;}
.orange{color:#ff7a00;}
.gray{color:#777;}

.power{
  margin-top:20px;
  font-size:24px;
  font-weight:900;
}

.power-label{
  font-size:13px;
  color:#6b7280;
  margin-top:2px;
}

.bar{
  height:10px;
  border-radius:999px;
  background:#e9e9e9;
  overflow:hidden;
  margin-top:14px;
}

.fill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#e00000 0%,#ff8a00 35%,#ffe000 58%,#13a51f 100%);
}

.footer{
  text-align:center;
  color:#7b7f89;
  margin-top:22px;
  font-size:14px;
  line-height:1.45;
}

.refresh{
  font-size:26px;
  cursor:pointer;
  user-select:none;
  margin-bottom:4px;
}

@media(max-width:370px){
  .app{
    padding:12px 10px 28px;
  }
  .grid{
    gap:10px;
  }
  .card{
    padding:13px;
    border-radius:16px;
  }
  .metric-value{
    font-size:31px;
  }
  .soc{
    font-size:31px;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="title">Homey Energy Dashboard</div>

  <section class="grid">
    <div class="card tempo blue" id="tempoTodayCard">
      <div>
        <div class="label">Aujourd’hui</div>
        <div class="value" id="tempoToday">--</div>
      </div>
      <div class="weather" id="weatherToday">☀</div>
    </div>

    <div class="card tempo blue" id="tempoTomorrowCard">
      <div>
        <div class="label">Demain</div>
        <div class="value" id="tempoTomorrow">--</div>
      </div>
      <div class="weather" id="weatherTomorrow">☁</div>
    </div>
  </section>

  <section class="grid" style="margin-top:12px">
    <div class="card metric">
      <div class="metric-title">Production solaire</div>
      <div class="metric-value" id="solarPower">--</div>
    </div>

    <div class="card metric">
      <div class="metric-title">Sortie Shelly / Réseau</div>
      <div class="metric-value" id="gridPower">--</div>
    </div>
  </section>

  <section class="grid" id="batteriesContainer" style="margin-top:12px"></section>

  <div class="footer">
    <div class="refresh" onclick="loadData()">↻</div>
    <div>Dernière mise à jour :</div>
    <div id="updatedAt">--</div>
  </div>

</div>

<script>
function fmtW(value){
  if(value === null || value === undefined || isNaN(value)) return '--';
  return Math.round(value).toLocaleString('fr-FR') + ' W';
}

function tempoClass(color){
  const c = String(color || '').toUpperCase();
  if(c === 'ROUGE') return 'tempo red';
  if(c === 'BLANC') return 'tempo white';
  return 'tempo blue';
}

function batteryVisual(direction){
  if(direction === 'CHARGING'){
    return {
      icon:'⚡',
      iconClass:'charge',
      state:'EN CHARGE',
      color:'green',
      label:'Puissance de charge'
    };
  }

  if(direction === 'DISCHARGING'){
    return {
      icon:'↓',
      iconClass:'decharge',
      state:'EN DÉCHARGE',
      color:'redText',
      label:'Puissance de décharge'
    };
  }

  if(direction === 'STALE'){
    return {
      icon:'!',
      iconClass:'stale',
      state:'PÉRIMÉE',
      color:'gray',
      label:'Donnée ancienne'
    };
  }

  return {
    icon:'Ⅱ',
    iconClass:'attente',
    state:'EN ATTENTE',
    color:'orange',
    label:'Puissance'
  };
}

function renderBattery(b, index){
  const soc = Math.round(Number(b.soc || 0));
  const v = batteryVisual(b.direction);
  const power = Math.abs(Number(b.powerW || 0));

  return `
    <div class="card battery">
      <div class="battery-title">Batterie ${index + 1}</div>

      <div class="battery-main">
        <div class="icon ${v.iconClass}">${v.icon}</div>
        <div>
          <div class="soc ${v.color}">${soc}%</div>
          <div class="state ${v.color}">${v.state}</div>
        </div>
      </div>

      <div class="power">${fmtW(power)}</div>
      <div class="power-label">${v.label}</div>

      <div class="bar">
        <div class="fill" style="width:${Math.max(0, Math.min(100, soc))}%"></div>
      </div>
    </div>
  `;
}

async function loadData(){
  try{
    const response = await fetch('/.netlify/functions/energy', { cache:'no-store' });
    const json = await response.json();
    const data = json.data;

    document.getElementById('solarPower').innerText =
      fmtW(data.solar.productionW);

    document.getElementById('gridPower').innerText =
      fmtW(data.grid.powerW);

    document.getElementById('tempoToday').innerText =
      data.tempo.today || '--';

    document.getElementById('tempoTomorrow').innerText =
      data.tempo.tomorrow || '--';

    document.getElementById('tempoTodayCard').className =
      'card ' + tempoClass(data.tempo.today);

    document.getElementById('tempoTomorrowCard').className =
      'card ' + tempoClass(data.tempo.tomorrow);

    document.getElementById('weatherToday').innerText =
      data.weather?.today?.icon || '☀';

    document.getElementById('weatherTomorrow').innerText =
      data.weather?.tomorrow?.icon || '☁';

    document.getElementById('batteriesContainer').innerHTML =
      data.batteries.map((b, i) => renderBattery(b, i)).join('');

    document.getElementById('updatedAt').innerText =
      new Date(data.updatedAt).toLocaleString('fr-FR');

  }catch(err){
    document.getElementById('updatedAt').innerText =
      'Erreur : ' + err.message;
  }
}

loadData();
setInterval(loadData, 10000);
</script>

</body>
</html>

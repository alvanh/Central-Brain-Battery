<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Homey Energy Dashboard</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0f1115;
  color:#fff;
}

.header{
  padding:24px;
  font-size:32px;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#1b1f27;
  border-radius:20px;
  padding:20px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
}

.card h2{
  margin-top:0;
  font-size:20px;
}

.value{
  font-size:42px;
  font-weight:700;
  margin-top:10px;
}

.small{
  opacity:.7;
  margin-top:8px;
}

.batteries{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.battery{
  background:#1b1f27;
  border-radius:20px;
  padding:20px;
}

.bar{
  width:100%;
  height:14px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
  margin-top:12px;
}

.fill{
  height:100%;
  background:#4ade80;
}

.status{
  margin-top:10px;
  font-weight:600;
}

.footer{
  padding:20px;
  opacity:.6;
}
</style>
</head>

<body>

<div class="header">
  Homey Energy Dashboard
</div>

<div class="grid">

  <div class="card">
    <h2>☀️ Production Solaire</h2>
    <div class="value" id="solarPower">--</div>
    <div class="small">Production instantanée</div>
  </div>

  <div class="card">
    <h2>⚡ Réseau / Shelly</h2>
    <div class="value" id="gridPower">--</div>
    <div class="small">Consommation réseau</div>
  </div>

  <div class="card">
    <h2>🔋 Batteries Total</h2>
    <div class="value" id="batteryTotal">--</div>
    <div class="small">Charge / Décharge globale</div>
  </div>

  <div class="card">
    <h2>🎨 EDF Tempo</h2>
    <div class="value" id="tempoToday">--</div>
    <div class="small" id="tempoTomorrow">--</div>
  </div>

</div>

<div class="batteries" id="batteriesContainer"></div>

<div class="footer" id="updatedAt">
  Mise à jour...
</div>

<script>

async function loadData(){

  try{

    const response = await fetch('/.netlify/functions/energy');
    const data = await response.json();

    document.getElementById('solarPower').innerText =
      `${Math.round(data.solar.productionW)} W`;

    document.getElementById('gridPower').innerText =
      `${Math.round(data.grid.powerW)} W`;

    document.getElementById('batteryTotal').innerText =
      `${Math.round(data.totals.batteryPowerW)} W`;

    document.getElementById('tempoToday').innerText =
      data.tempo.today;

    document.getElementById('tempoTomorrow').innerText =
      `Demain : ${data.tempo.tomorrow}`;

    document.getElementById('updatedAt').innerText =
      `Dernière mise à jour : ${new Date(data.updatedAt).toLocaleString()}`;

    const container = document.getElementById('batteriesContainer');

    container.innerHTML = '';

    data.batteries.forEach(battery => {

      const percent = battery.soc || 0;

      let state = 'Attente';

      if(battery.direction === 'CHARGING')
        state = 'Charge';

      if(battery.direction === 'DISCHARGING')
        state = 'Décharge';

      if(battery.direction === 'STALE')
        state = 'Données périmées';

      container.innerHTML += `
        <div class="battery">
          <h2>${battery.homeyName}</h2>

          <div class="value">
            ${percent}%
          </div>

          <div class="bar">
            <div class="fill" style="width:${percent}%"></div>
          </div>

          <div class="status">
            ${state}
          </div>

          <div class="small">
            ${battery.powerW} W
          </div>

          <div class="small">
            ${battery.temperatureC}°C
          </div>

        </div>
      `;
    });

  }catch(err){
    console.error(err);
  }
}

loadData();

setInterval(loadData,15000);

</script>

</body>
</html>
